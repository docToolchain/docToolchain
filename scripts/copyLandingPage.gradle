
//tag::copyLandingPage[]
task copyLandingPage(
    description: 'copy a landing page template to your project so you have a start page to customize',
    group: 'docToolchain helper'
) {
    doLast {
        def color = { color, text ->
            def colors = [black: 30, red: 31, green: 32, yellow: 33, blue: 34, magenta: 35, cyan: 36, white: 37]
            return new String((char) 27) + "[${colors[color]}m${text}" + new String((char) 27) + "[0m"
        }
        def source = new File(projectDir, 'src/site/doc/landingpage.gsp')
        // The landing page lives in the project's site theme so it overlays the
        // built-in theme during generateSite (index.gsp includes doc/<landingPage>).
        def siteFolder = config.microsite.siteFolder ?: '../site'
        def landingPageName = config.microsite.landingPage ?: 'landingpage.gsp'
        def targetDir = new File(new File(docDir, inputPath), siteFolder + '/doc')
        def target = new File(targetDir, landingPageName)

        def force = project.hasProperty('force')
        if (target.exists() && !force && !System.getenv('DTC_HEADLESS')) {
            ant.input(message: "${color 'green', target.canonicalPath + ' already exists. Overwrite?'}",
                validargs: 'y,n', addproperty: 'overwriteLandingPage')
            if (ant.overwriteLandingPage != 'y') {
                println "skipped — landing page left unchanged"
                return
            }
        }

        targetDir.mkdirs()
        copy {
            from source
            into targetDir
            rename { landingPageName }
        }
        println "landing page copied into ${target.canonicalPath}"
        if (!config.microsite.landingPage) {
            println color('green', "set microsite.landingPage = '${landingPageName}' in your config to use it")
        }
    }
}
//end::copyLandingPage[]
